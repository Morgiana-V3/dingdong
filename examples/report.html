<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 24px; background: #f4f6f7; color: #26343b; font: 16px/1.8 sans-serif; }
    article { max-width: 640px; margin: auto; }
    .label { color: #48746a; font-size: 13px; }
    h1 { font-size: 28px; line-height: 1.35; margin: 12px 0 20px; }
    h2 { font-size: 19px; margin-top: 30px; }
    .note { padding: 18px; border-left: 4px solid #48746a; background: #e6eeeb; border-radius: 0 12px 12px 0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e5e9e8; }
    th { color: #647575; font-size: 13px; }
    code { font-family: monospace; background: #e6eeeb; padding: 3px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <article>
    <div class="label">HTML 排版示例</div>
    <h1>脚本生成的报告，<br>保留自己的样式。</h1>
    <p>这是一条用于验证叮咚的测试消息。正文的颜色、表格和间距来自这个 HTML 文件。</p>
    <div class="note">手机收到并保存后，即使暂时断网，也能继续阅读这份报告。</div>
    <h2>显示检查</h2>
    <table>
      <tr><th>内容</th><th>用途</th></tr>
      <tr><td>表格</td><td>排列脚本结果</td></tr>
      <tr><td>自定义 CSS</td><td>控制颜色与间距</td></tr>
      <tr><td>长文本</td><td>自动换行，适应手机宽度</td></tr>
    </table>
    <h2>更改样式</h2>
    <p>修改文件中的 <code>&lt;style&gt;</code>，再使用新的消息 ID 发送即可。无需更新手机安装包。</p>
  </article>
</body>
</html>
