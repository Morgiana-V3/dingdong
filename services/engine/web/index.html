<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>叮咚引擎管理台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="shell">
    <section id="login-view" class="card login-card" hidden>
      <h1>叮咚引擎管理台</h1>
      <p class="muted">管理密钥位于数据目录 <code>admin.key</code>。</p>
      <form id="login-form">
        <input id="admin-key" type="password" placeholder="输入管理密钥" required>
        <button type="submit" class="primary">登录</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <section id="main-view" hidden>
      <header class="topbar">
        <div>
          <h1>叮咚插件引擎</h1>
          <p class="muted">自定义插件调度、AI 服务商与凭据管理</p>
        </div>
        <button id="refresh-btn">刷新</button>
      </header>
      <p id="banner-error" class="error"></p>

      <div class="grid">
        <section class="card">
          <div class="section-head">
            <h2>任务列表</h2>
            <span id="plugin-count" class="badge"></span>
          </div>
          <div id="task-list"></div>
        </section>

        <section class="card">
          <div class="section-head">
            <h2>已加载插件</h2>
          </div>
          <div id="plugin-list"></div>
        </section>

        <section class="card">
          <div class="section-head">
            <h2>所需凭据 / 登录态</h2>
          </div>
          <div id="credential-list"></div>
        </section>

        <section class="card">
          <div class="section-head">
            <h2>AI 服务配置</h2>
          </div>
          <div id="provider-list"></div>
        </section>
      </div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
