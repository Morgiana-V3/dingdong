name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Android Keystore (if configured)
        if: ${{ secrets.DINGDONG_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.DINGDONG_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.keystore"
          echo "DINGDONG_KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: mobile
        env:
          DINGDONG_KEYSTORE_PASSWORD: ${{ secrets.DINGDONG_KEYSTORE_PASSWORD }}
          DINGDONG_KEY_ALIAS: ${{ secrets.DINGDONG_KEY_ALIAS }}
          DINGDONG_KEY_PASSWORD: ${{ secrets.DINGDONG_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
